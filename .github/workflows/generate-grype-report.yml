name: Generate Grype PDF Report

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests pdfkit
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf
      
      - name: Generate Grype PDF Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/workflows/generatePDF charlenelearn2learn-blip juiceshop-supply-chain-lab --output grype-report.pdf
      
      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: grype-report
          path: grype-report.pdf
          retention-days: 30
      
      - name: Upload HTML backup if PDF conversion failed
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: grype-report-html
          path: grype-report-temp.html
          retention-days: 30
